name: Model watcher

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs on quiet repositories.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the Hugging Face catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REFRESH: "1"
        run: python3 scripts/fetch_models.py
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- src/data/models.json src/data/fetch-report.json; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "gpufit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/models.json src/data/fetch-report.json
          git commit -m "data: refresh model catalog"
          git push
