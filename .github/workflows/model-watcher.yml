name: Model watcher

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs on quiet repositories.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. Canceling a run that has already accepted mail, or that is
# mid-push, can send the same alert twice or drop a catalog commit.
concurrency:
  group: model-watcher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Refresh the Hugging Face catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REFRESH: "1"
        run: python3 scripts/fetch_models.py
      - name: Commit catalog changes
        id: catalog
        run: |
          if git diff --quiet -- src/data/models.json src/data/fetch-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "gpufit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/models.json src/data/fetch-report.json
          git commit -m "data: refresh model catalog"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: Purge unconfirmed alert signups
        id: purge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALERTS_SOURCE: d1
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Unconfirmed purge skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          npx tsx scripts/purge-unconfirmed.ts
      - name: Mail subscribers about new fits
        if: steps.purge.outcome == 'success' || steps.purge.outcome == 'failure'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TOKEN_SECRET: ${{ secrets.ALERT_TOKEN_SECRET }}
          SITE_URL: https://gpufit.tech
          ALERTS_SOURCE: d1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_FROM" ] || [ -z "$ALERT_TOKEN_SECRET" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Fit mail skipped. Add RESEND_API_KEY, ALERT_FROM, ALERT_TOKEN_SECRET, CLOUDFLARE_API_TOKEN, and CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          npx tsx scripts/match-alerts.ts --send
      - name: Deploy when the catalog changed
        if: always() && steps.catalog.outputs.changed == 'true' && steps.catalog.conclusion == 'success'
        env:
          SITE_URL: https://gpufit.tech
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          npm run build
          npx wrangler deploy
